<div id="document-list">
  {% for document in documents %}
    <div class="card" id="document-{{ document.pk }}">
      <h3>{{ document.title }}</h3>
      <span class="pill">{{ document.get_doc_type_display }}</span>
      {% if document.tags %}<p><small>{{ document.tags }}</small></p>{% endif %}
      <form method="post"
            action="{% url 'portfolio:document_delete' document.pk %}"
            hx-post="{% url 'portfolio:document_delete' document.pk %}"
            hx-target="#document-list"
            hx-swap="outerHTML">
        {% csrf_token %}
        <button type="submit" class="link-button">Delete</button>
      </form>
    </div>
  {% empty %}
    <p>No portfolio documents yet - add your CV below to get started.</p>
  {% endfor %}
</div>
