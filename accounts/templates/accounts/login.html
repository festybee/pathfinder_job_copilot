{% extends "base.html" %}
{% block title %}Log in - Pathfinder Job Copilot{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post" class="stacked card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">Log in</button>
  </form>
  <p>No account yet? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
{% endblock %}
