{% extends "base.html" %}
{% block title %}Sign up - Pathfinder Job Copilot{% endblock %}
{% block content %}
  <h1>Create your account</h1>
  <form method="post" class="stacked card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">Sign up</button>
  </form>
  <p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}
