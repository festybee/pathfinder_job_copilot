{% extends "base.html" %}
{% block title %}Edit {{ profile.name }} - Pathfinder Job Copilot{% endblock %}
{% block content %}
  <h1>Edit "{{ profile.name }}"</h1>
  <form method="post" class="stacked card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">Save changes</button>
  </form>
  <p><a href="{% url 'jobsearch:criteria_detail' profile.pk %}">&larr; back to criteria</a></p>
{% endblock %}
